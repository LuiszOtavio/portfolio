<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=JetBrains+Mono:wght@500&display=block"
    />
    <style>
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        position: relative;
        background: #0b0d12;
        color: #e7e9ee;
        font-family: Inter, sans-serif;
        display: flex;
        align-items: center;
        gap: 64px;
        padding: 0 80px;
      }
      .dots {
        position: absolute; inset: 0;
        background-image: radial-gradient(#242835 1.2px, transparent 1.2px);
        background-size: 24px 24px;
        mask-image: radial-gradient(ellipse 80% 80% at 70% 40%, #000 25%, transparent 75%);
      }
      .glow { position: absolute; border-radius: 50%; filter: blur(90px); }
      .g1 { width: 560px; height: 560px; right: -120px; top: -200px; background: rgba(129, 140, 248, 0.28); }
      .g2 { width: 380px; height: 380px; left: -160px; bottom: -200px; background: rgba(245, 180, 84, 0.12); }
      .text { position: relative; flex: 1; }
      .role { font-family: 'JetBrains Mono', monospace; font-size: 26px; color: #818cf8; }
      h1 { margin-top: 14px; font-size: 76px; font-weight: 700; letter-spacing: -2px; line-height: 1.02; }
      .headline { margin-top: 26px; font-size: 32px; font-weight: 500; line-height: 1.35; }
      .headline span { color: #f5b454; white-space: nowrap; }
      .bar { margin-top: 34px; width: 140px; height: 4px; border-radius: 4px; background: linear-gradient(90deg, #818cf8, #f5b454); }
      .photo { position: relative; width: 330px; flex: none; }
      .photo::before {
        content: ''; position: absolute; inset: 0; transform: translate(16px, 16px);
        border-radius: 22px; background: linear-gradient(135deg, #818cf8, #f5b454); opacity: 0.7;
      }
      .photo img {
        position: relative; display: block; width: 100%; aspect-ratio: 25 / 32; object-fit: cover;
        border-radius: 22px; border: 1px solid #242835;
      }
    </style>
  </head>
  <body>
    <div class="dots"></div>
    <div class="glow g1"></div>
    <div class="glow g2"></div>
    <div class="text">
      <p class="role" id="role"></p>
      <h1>Luis Otávio Batista</h1>
      <p class="headline" id="headline"></p>
      <div class="bar"></div>
    </div>
    <div class="photo"><img id="photo" alt="" /></div>
    <script>
      const texts = {
        pt: {
          role: 'Analista de Suporte',
          headline: 'Suporte & Automação em Cloud · Python · Azure — <span>em transição para DevOps</span>',
        },
        en: {
          role: 'Support Analyst',
          headline: 'Automation & Cloud Support · Python · Azure — <span>transitioning into DevOps</span>',
        },
      };
      const params = new URLSearchParams(location.search);
      const t = texts[params.get('lang') || 'pt'];
      document.getElementById('role').textContent = t.role;
      document.getElementById('headline').innerHTML = t.headline;
      document.getElementById('photo').src = params.get('photo');
    </script>
  </body>
</html>
